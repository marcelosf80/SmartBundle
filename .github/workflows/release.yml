name: Build and Release SmartBundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "app_icon.ico" --add-data "app_icon.ico;." --name "SmartBundle" sb_gui.py

      - name: Copy Installer Assets to Dist
        run: |
          Copy-Item -Path "app_icon.ico" -Destination "dist\SmartBundle\app_icon.ico" -Force
          Copy-Item -Path "Instalar_SmartBundle_En_C.bat" -Destination "dist\SmartBundle\Instalar_SmartBundle_En_C.bat" -Force
          Copy-Item -Path "install_to_program_files.ps1" -Destination "dist\SmartBundle\install_to_program_files.ps1" -Force
          Copy-Item -Path "sb_context_menu.py" -Destination "dist\SmartBundle\sb_context_menu.py" -Force

      - name: Compress Build Artifact
        run: |
          Compress-Archive -Path "dist\SmartBundle\*" -DestinationPath "dist\SmartBundle-Windows.zip"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SmartBundle-Windows.zip
          generate_release_notes: true
